<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan - ADUIN | Campus Facility Reporting</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="dashboard-body">

  <div class="dashboard-wrapper">

    <!-- ==================================================================
         SIDEBAR (skeleton — diisi via JS)
         ================================================================== -->
    <aside class="sidebar-blue">

      <!-- ATAS: brand + menu -->
      <div class="sidebar-top">

        <!-- Brand (statis, sama untuk semua role) -->
        <a href="index.html" class="sidebar-brand">
          <div class="sidebar-brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5m-4 0h4">
              </path>
            </svg>
          </div>
          <div>
            <h1 class="sidebar-brand-title">ADUIN</h1>
            <p class="sidebar-brand-subtitle">Facility Reporting</p>
          </div>
        </a>

        <!-- Menu navigasi — DIISI VIA JS -->
        <nav class="sidebar-nav" id="sidebarNav" aria-label="Menu Navigasi Utama"></nav>
      </div>

      <!-- BAWAH: profil + logout -->
      <div class="sidebar-bottom">
        <div class="sidebar-user-card">
          <div class="user-avatar-sm" id="sidebarAvatar">–</div>
          <div class="sidebar-user-info">
            <h4 class="sidebar-user-name" id="sidebarName">–</h4>
            <p class="sidebar-user-role" id="sidebarRole">–</p>
          </div>
        </div>

        <a href="login.html" class="btn-logout" id="btnLogout" title="Keluar dari akun">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Keluar</span>
        </a>
      </div>
    </aside>

    <!-- ==================================================================
         MAIN CONTENT
         ================================================================== -->
    <main class="main-content scroll-area" style="padding: 32px 48px; background-color: #f8fafc;">

      <!-- Top Kicker & Title -->
      <div style="margin-bottom: 24px;">
        <div style="font-size: 13px; font-weight: 500; color: #94a3b8; margin-bottom: 4px;">
          <span id="breadcrumbRole">–</span>
        </div>
        <h1 style="font-size: 26px; font-weight: 800; color: #091441; margin: 0;">Pengaturan</h1>
      </div>

      <!-- Section Title & Subtitle -->
      <div style="margin-bottom: 28px;">
        <h2 style="font-size: 22px; font-weight: 700; color: #0f172a; margin: 0 0 6px 0;">Profil & pengaturan</h2>
        <p style="font-size: 14px; color: #64748b; margin: 0;">Kelola informasi akun dan keamanan kata sandi anda.</p>
      </div>

      <!-- Two-Column Grid -->
      <div class="settings-grid">

        <!-- KOLOM KIRI: Kartu Profil (DIISI VIA JS) -->
        <section class="glass-card profile-card-clean">
          <div class="profile-avatar-wrap">
            <div class="profile-avatar-large" id="profileAvatar">–</div>
            <label for="avatarUploadInput" class="avatar-camera-btn" title="Ubah foto profil">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
              <input type="file" id="avatarUploadInput" accept="image/*" style="display: none;" />
            </label>
          </div>

          <h3 class="profile-name" id="profileName">–</h3>
          <div class="profile-nip" id="profileId">–</div>
          <span class="badge-orange" id="profileRoleBadge">–</span>

          <!-- EMAIL ONLY -->
          <div class="profile-email" id="profileEmail">–</div>
        </section>

        <!-- KOLOM KANAN: Form Ubah Password (STATIS — universal) -->
        <section class="glass-card form-card-clean">
          <div class="form-header-box">
            <h3 class="form-title">Ubah kata sandi</h3>
            <p class="form-guide-text">Gunakan kombinasi huruf dan angka agar akun tetap aman.</p>
          </div>

          <div id="passwordAlert" class="alert-box"
            style="display:none; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px;"></div>

          <form id="formUbahPassword" class="form-fields-wrap">

            <!-- Password Lama -->
            <div class="form-group-item">
              <label for="oldPassword" class="form-label">Password lama</label>
              <div class="input-pill-box">
                <span class="input-icon-left">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input type="password" id="oldPassword" required class="input-clean-field" placeholder="••••••••"
                  autocomplete="current-password">
                <button type="button" class="btn-toggle-eye toggle-password-btn" data-target="oldPassword"
                  aria-label="Toggle lihat password">
                  <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-off-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                    </path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Password Baru -->
            <div class="form-group-item">
              <label for="newPassword" class="form-label">Password baru</label>
              <div class="input-pill-box">
                <span class="input-icon-left">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input type="password" id="newPassword" required class="input-clean-field" placeholder="••••••••"
                  autocomplete="new-password">
                <button type="button" class="btn-toggle-eye toggle-password-btn" data-target="newPassword"
                  aria-label="Toggle lihat password">
                  <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-off-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                    </path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Konfirmasi Password Baru -->
            <div class="form-group-item">
              <label for="confirmPassword" class="form-label">Konfirmasi password baru</label>
              <div class="input-pill-box">
                <span class="input-icon-left">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input type="password" id="confirmPassword" required class="input-clean-field" placeholder="••••••••"
                  autocomplete="new-password">
                <button type="button" class="btn-toggle-eye toggle-password-btn" data-target="confirmPassword"
                  aria-label="Toggle lihat password">
                  <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-off-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                    </path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <div style="padding-top: 6px;">
              <button type="submit" class="btn-simpan-perubahan" id="btnSimpanPassword">Simpan Perubahan</button>
            </div>

          </form>
        </section>

      </div>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
</body>

</html>
