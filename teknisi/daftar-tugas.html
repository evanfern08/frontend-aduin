<head>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">

<div class="dashboard-wrapper">
    
    <!-- SIDEBAR KIRI -->
    <aside class="sidebar-blue" aria-label="Navigasi teknisi">
      <div class="sidebar-top">
        <a href="index.html" class="sidebar-brand">
          <span class="sidebar-brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 9h.01M15 9h.01"></path>
            </svg>
          </span>
          <span>
            <span class="sidebar-brand-title">ADUIN</span>
            <span class="sidebar-brand-subtitle">Facility Reporting</span>
          </span>
        </a>

        <nav class="sidebar-nav">
          <a href="index.html" class="nav-link">
            <i class="fa-solid fa-border-all"></i>
            <span>Dashboard</span>
          </a>
          <a href="daftar-tugas.html" class="nav-link active">
            <i class="fa-solid fa-list-check"></i>
            <span>Daftar Tugas</span>
          </a>
          <a href="riwayat.html" class="nav-link">
            <i class="fa-solid fa-clipboard-list"></i>
            <span>Daftar Laporan</span>
          </a>
          <a href="../pengaturan.html?role=teknisi" class="nav-link">
            <i class="fa-solid fa-gear"></i>
            <span>Pengaturan</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="sidebar-user-card">
          <span class="user-avatar-sm role-teknisi">BP</span>
          <div class="sidebar-user-info">
            <p class="sidebar-user-name">Budi Prakroso</p>
            <p class="sidebar-user-role">Teknisi</p>
          </div>
        </div>
        <a href="../login.html" class="btn-logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="16" height="16">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <path d="m16 17 5-5-5-5M21 12H9"></path>
          </svg>
          <span>Keluar</span>
        </a>
      </div>
    </aside>


    <!-- Main Content Area -->
     <div class="main-content">
      <header class="content-header">
        <div>
          <span class="header-breadcrumb">Teknisi Pemeliharaan / <strong>Daftar Tugas</strong></span>
          <h1 class="header-title">Daftar Tugas</h1>
        </div>
      </header>

      <main class="content-body">
        <section class="glass-card" style="padding: 12px 20px; margin-bottom: 20px;">
          <div style="display: flex; gap: 15px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px;" id="tab-container">
            <!-- Tombol tab bakal di-render JS -->
          </div>
        </section>

        <section class="task-section">
          <div class="task-grid" id="task-list-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;"></div>
        </section>
      </main>
    </div>
  </div>
    <!-- MODAL DETAIL PENGADUAN -->
  <div id="modalDetailPengaduan" class="modal-overlay hidden" onclick="tutupDetail()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <h3 class="modal-title" id="detailJudul">Judul Laporan</h3>
          <span class="modal-subtitle" id="detailId">#ID</span>
        </div>
        <button type="button" class="modal-close" onclick="tutupDetail()">✕</button>
      </div>
      
      <div class="modal-body" style="font-size: 13px;">
        <p><strong>Lokasi:</strong> <span id="detailLokasi">-</span></p>
        <p><strong>Pelapor:</strong> <span id="detailPelapor">-</span></p>
        <p><strong>Status:</strong> <span id="detailStatus">-</span></p>
        <p><strong>Tanggal:</strong> <span id="detailTanggal">-</span></p>
        <div style="margin-top: 12px; padding: 12px; background: #f8fafc; border-radius: 8px;">
          <strong>Catatan Teknisi:</strong><br>
          <span id="detailDeskripsi">-</span>
        </div>
      </div>

      <div class="modal-footer" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
        <!-- Tombol Edit ditambahkan di sini -->
        <button type="button" class="btn btn-success" onclick="editLaporanSelesai()" style="width: 100%;">Edit Catatan & Bukti</button>
      </div>
    </div>
  </div>
  <script src="js/teknisi.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
